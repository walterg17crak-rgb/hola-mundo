<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Go - Formulario</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

<header>
    <h1>Travel Go </h1>
    <img src="/image/Logo.jpeg" alt="Logo Travel Go" class="logo">
    <nav class="contenedor-menu">
            <a href="/src/index.html">Inicio</a>
            <a href="/pages/viajes.html">Viajes</a>
            <a href="/pages/clima.html">Clima</a>
            <a href="/pages/itinerario.html">Mi itinerario</a>
            <a href="/pages/comentarios.html">Comentarios</a>
            <a href="/pages/formulario.html">Formulario</a>
    </nav>
</header>

<main>
    <h2>Agenda tu viaje</h2>
    <p>Completa los siguientes datos para planear tus vacaciones.</p>

    <form id="formViaje">
        <label for="documento">N.º de documento</label>
        <input type="text" id="documento" required>

        <label for="nombres">Nombres</label>
        <input type="text" id="nombres" required>

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" required>

        <label for="salida">Lugar de salida</label>
        <input type="text" id="salida" required>

        <label for="destino">Destino</label>
        <select id="destino" required>
            <option value="">Selecciona una ciudad</option>
            <option>Barranquilla</option>
            <option>Cartagena</option>
            <option>Bogotá</option>
            <option>Santa Marta</option>
            <option>Bucaramanga</option>
            <option>Cali</option>
        </select>

        <label for="fecha">Fecha del viaje</label>
        <input type="date" id="fecha" required>

        <label for="regreso">¿Ida y vuelta?</label>
        <select id="regreso">
            <option value="Sí">Sí</option>
            <option value="No">No</option>
        </select>

        <label for="pasajeros">Número de pasajeros</label>
        <input type="number" id="pasajeros" min="1" value="1" required>

        <button class="boton" type="submit">Agendar viaje</button>
    </form>

    <div id="resultado"></div>
</main>

<footer>© 2026 Travel Go | Todos los derechos reservados</footer>

<script>
document.getElementById("formViaje").addEventListener("submit", function(event) {
    event.preventDefault();

    const nombres = document.getElementById("nombres").value;
    const destino = document.getElementById("destino").value;
    const fecha = document.getElementById("fecha").value;
    const pasajeros = document.getElementById("pasajeros").value;

    const resultado = document.getElementById("resultado");
    resultado.textContent =
        "¡Gracias, " + nombres +
        "! Tu solicitud de viaje a " + destino +
        " para el " + fecha +
        " ha sido registrada en esta página. Pasajeros: " + pasajeros + ".";

    resultado.className = "mensaje";
});
</script>

</body>
</html>
